<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background:  linear-gradient(to right, red, blue);
    }
    .container{
        display: flex;
        justify-content: space-around;
    }
    .uber{
        color: black;
        font-size: 20px;
        font-weight: bold;
    }
    .hold1{
        width: 200px;
        height: 50px;
        border: 2px solid;
        background-color: white;
        position: absolute;
        left: 10px;
        top: 70px;

    }


   


                 /* Example2 */
    
    .subscribe{
        background-color: rgb(200, 0, 0);
        color: white;
        border: none;
        margin-top: 150px;
        height: 36px;
        width: 105px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 10px;
        transition: opacity 0.15s;
     }

     .subscribe:hover{
        opacity: 0.8;
    
     }
     .subscribe:active{
        opacity: 0.3;
     }
     .join{
        background-color: white;
        border-color: rgb(41, 118, 211) ;
        border-style: solid;
        border-width: 1px;
        color: rgb(41, 118, 211);
        height: 36px;
        width: 62px;
        border-radius: 2px;
        cursor: pointer;
        transition: background-color 0.15s,
        color 0.15s;
     }
     .join:hover{
        background-color: rgb(41, 118, 211);
        color: white;
     }
     .join:active{
        opacity: 0.7;

     }
     .tweet{
        background-color: rgb(2, 158, 255);
        color: white;
        border: none;
        height: 36px;
        width: 74px;
        border-radius: 18px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-left: 10px;
        transition: box-shadow 0.15s;
       

     }
     .tweet:hover{
             box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
     }



                 

    




</style>
<body>
    <div class="container">
        <h4 class="uber">Uber</h4>
        <div class="hold1">
            <button class="box1">Request now</button>
        </div>

         <h4 class="amazon">Amazon</h4>
        <div class="hold2">
            <button class="box2">Add to Cart</button>
        </div>

        <h4 class="hub">GitHub</h4>
        <div class="hold3">
            <button class="box3">Sign up</button>
        </div>
    </div>
            
             
    
    
    <!-- Example2 -->
                <div>
                    <button class="subscribe">SUBSCRIBE</button>
                    <button class="join">JOIN</button>
                    <button class="tweet">Tweet</button>
                </div>









</body>
</html>
